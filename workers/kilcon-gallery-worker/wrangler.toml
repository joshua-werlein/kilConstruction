name = "kilcon-gallery-worker"
main = "src/index.js"
# Kil.con.contact account (owns kilcon-gallery + kilcon-db); avoids deploying to the wrong account
account_id = "8481dbc471ac3a4aa14cc26ea366f956"
compatibility_date = "2025-11-13"
compatibility_flags = []
workers_dev = true
preview_urls = false

[observability]
enabled = true
head_sampling_rate = 1

[vars]
BUCKET_BASE_URL = "https://images.kilcon.work"
THUMB_BASE_URL  = "https://images.kilcon.work"
SESSION_VERSION = "3"

# Facebook Page sync (see docs/facebook-webhook.md)
FB_PAGE_ID       = "305397115992497" # numeric Page ID; events for other Pages are ignored
FB_APP_ID        = "1427044999395408" # Meta App ID (public, not a secret); used by the admin health check
FB_GRAPH_VERSION = "v26.0"
FB_AUTO_IMPORT   = "true"    # owner-approved 2026-10-19; "false" pauses imports (events still recorded)
# Days a photo confirmed deleted/unpublished on Facebook stays recoverable
# (hidden, private master kept) before permanent deletion. OWNER DECISION.
FB_REMOVED_RETENTION_DAYS = "30"
# Master switch: "false" makes every /api/gallery-api/facebook/* route 404 and
# keeps public galleries from touching D1. "true" (stage L2) opens the webhook
# and admin routes; nothing is imported while FB_AUTO_IMPORT is "false".
FB_INTEGRATION_ENABLED = "true"

# Secrets already set live via the Cloudflare dashboard / `wrangler secret put`.
# Do NOT add these under [vars] — doing so and deploying would silently
# overwrite the live secret with a plaintext value:
#   ADMIN_SECRET
#   TURNSTILE_SECRET
#   FB_APP_SECRET          Meta App Secret (verifies X-Hub-Signature-256)
#   FB_VERIFY_TOKEN        random string also entered in Meta webhook config
#   FB_PAGE_ACCESS_TOKEN   long-lived Page access token

[[r2_buckets]]
binding = "GALLERY_BUCKET"
bucket_name = "kilcon-gallery"

# Private (no public access, no custom domain): review photos and Facebook
# master copies. Create once with: npx wrangler r2 bucket create kilcon-private
[[r2_buckets]]
binding = "PRIVATE_BUCKET"
bucket_name = "kilcon-private"

[[d1_databases]]
binding = "DB"
database_name = "kilcon-db"
database_id = "095cfe7f-d0af-49e8-b92a-942fa093bfe6"
# Shared repo-root migrations; `wrangler d1 migrations apply kilcon-db --remote`
# applies only the ones not yet recorded in d1_migrations.
migrations_dir = "../../migrations"

# Hourly sweeper. It never polls Facebook for new posts (webhooks do that).
# Always: due retention deletes + inbox pruning (D1/R2 only).
# FB_INTEGRATION_ENABLED="true": also processes remove/hide events.
# Both switches "true": also retries failed/stranded imports.
[triggers]
crons = ["17 * * * *"]

[[ratelimits]]
name = "READ_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 60
  period = 10

[[ratelimits]]
name = "WRITE_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 3
  period = 60

[[routes]]
pattern = "kilcon.work/api/reviews*"
zone_name = "kilcon.work"

[[routes]]
pattern = "kilcon.work/api/gallery-api*"
zone_name = "kilcon.work"

# Blocks direct access to review attachments on the public R2 custom domain.
[[routes]]
pattern = "images.kilcon.work/Reviews/*"
zone_name = "kilcon.work"
