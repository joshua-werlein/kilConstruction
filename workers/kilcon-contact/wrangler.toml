name = "kilcon-contact"
main = "src/index.js"
compatibility_date = "2025-11-06"
compatibility_flags = []
workers_dev = false # 2026-11-24: zone routes only, so the WAF rate-limit rule cannot be bypassed via *.workers.dev
preview_urls = false

[observability]
enabled = true
head_sampling_rate = 1

[vars]
FROM_EMAIL = "KilCon <contact@kilcon.work>"
TO_EMAIL   = "kil.con.contact@gmail.com"

# Secrets already set live via the Cloudflare dashboard / `wrangler secret put`.
# Do NOT add these under [vars] — doing so and deploying would silently
# overwrite the live secret with a plaintext value:
#   RESEND_API_KEY
#   TURNSTILE_SECRET

[[ratelimits]]
name = "WRITE_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 3
  period = 60

# Durable Object rate limiter (src/rate-limiter.js). The migration is applied
# only by `wrangler deploy`; versions created before it (ec34f316 and older)
# can no longer be rolled back to. Never set RATE_LIMIT_WINDOW_MS here: it is a
# test-only override.
[[durable_objects.bindings]]
name = "CONTACT_LIMITER"
class_name = "ContactRateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ContactRateLimiter"]

[[routes]]
pattern = "kilcon.work/api/contact*"
zone_name = "kilcon.work"

[[routes]]
pattern = "www.kilcon.work/api/contact*"
zone_name = "kilcon.work"

[dev]
port = 8787
local_protocol = "http"
